version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: divine_favour_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password is required}
      POSTGRES_DB: ${POSTGRES_DB:-divine_favour_prod}
    volumes:
      - df_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-divine_favour_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - df_network

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: divine_favour_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-divine_favour_prod}?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,https://divinefavourpackaging.com}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be at least 32 characters}
      SESSION_MAX_AGE_MS: ${SESSION_MAX_AGE_MS:-86400000}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
    command: >
      sh -c "npx prisma migrate deploy && node dist/server.js"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - df_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api/v1}
    container_name: divine_favour_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    networks:
      - df_network

volumes:
  df_pgdata:
    driver: local

networks:
  df_network:
    driver: bridge
